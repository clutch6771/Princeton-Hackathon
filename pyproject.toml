# Tool configuration only. Add a [project] table when Python packages exist.

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = ["judge", "tests"]

[tool.ruff]
line-length = 88
src = [".", "watcher_Agent"]
extend-exclude = [".venv", "DerivedData", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# Judge backend tests: asserts and obviously fake credentials are expected.
"watcher_Agent/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
# The Judge package is imported as `judge` (root: watcher_Agent/).
mypy_path = "watcher_Agent"

[tool.pytest.ini_options]
testpaths = ["watcher_Agent/tests"]
pythonpath = [".", "watcher_Agent"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:langsmith.*",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests touching external systems",
    "live: opt-in tests that call a real external provider",
]

[tool.coverage.run]
source = ["judge"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
